name: PR checks

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    # setup-python has no 3.9 build for ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Raspberry Pi OS: bullseye (OctoPi 1.0) ships 3.9, bookworm 3.11, trixie 3.13
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: pytest
        run: python -m pytest -v tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Python syntax check
        run: |
          python -m py_compile setup.py octoprint_nasbackup/__init__.py

      - name: JS syntax check
        run: |
          node --check octoprint_nasbackup/static/js/nasbackup.js

      - name: Validate gettext catalogs compile
        run: |
          set -euo pipefail
          while IFS= read -r -d '' po; do
            msgfmt --check "$po" -o /dev/null
            echo "OK: $po"
          done < <(find octoprint_nasbackup/translations -type f -name "*.po" -print0)
